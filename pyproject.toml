[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmequity"
version = "0.1.0"
description = "Systematic evaluation of allele-frequency disparities across reference populations and their effect on pharmacogenomic dosing logic."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.scripts]
pharmequity-cli = "pharmequity.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
